[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lithium-plating-detection"
version = "1.0.0"
description = "Lithium plating non-destructive detection via classical signal processing (M1-M4), no deep learning"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ilo-love7" }]
keywords = [
    "lithium-ion battery", "lithium plating", "non-destructive detection",
    "signal processing", "dQ/dV", "coulombic efficiency",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "ruptures>=1.1.8",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/ilo-love7/lithium-plating-detection"
Repository = "https://github.com/ilo-love7/lithium-plating-detection"
Issues = "https://github.com/ilo-love7/lithium-plating-detection/issues"

[project.scripts]
plating = "plating.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plating = ["resources/config.yaml"]

# ===================== Ruff =====================
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

# ===================== Pytest =====================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
